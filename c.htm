<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secure P2P Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  background:#121212;
  color:#fff;
  font-family: Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
#box {
  width:100%;
  max-width:420px;
  background:#1e1e1e;
  padding:15px;
  border-radius:10px;
}
input,button {
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:6px;
}
input { background:#2a2a2a; color:#fff; }
button { background:#03dac6; font-weight:bold; }
#chat { display:none; }
#msgs {
  height:280px;
  overflow:auto;
  background:#111;
  padding:8px;
  border-radius:6px;
}
.msg { margin-bottom:6px; }
</style>
</head>

<body>
<div id="box">

<div id="join">
  <input id="name" placeholder="Your name">
  <input id="pass" type="password" placeholder="Room password">
  <button onclick="createRoom()">Create Chat</button>
  <hr>
  <input id="roomId" placeholder="Room ID from link">
  <button onclick="joinRoom()">Join Chat</button>
</div>

<div id="chat">
  <div id="msgs"></div>
  <input id="text" placeholder="Message">
  <button onclick="send()">Send</button>
</div>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
let peer, conn;
let username, password;

const params = new URLSearchParams(location.search);
if (params.get("room")) {
  roomId.value = params.get("room");
}

function createRoom() {
  username = name.value.trim();
  password = pass.value;

  if (!username || !password) {
    alert("Fill name & password");
    return;
  }

  peer = new Peer();

  peer.on("open", id => {
    showChat();
    alert("Share this Room ID:\n" + id);

    history.replaceState(null,"","?room="+id);
  });

  peer.on("connection", c => {
    conn = c;
    conn.on("data", receive);
  });
}

function joinRoom() {
  username = name.value.trim();
  password = pass.value;
  const id = roomId.value.trim();

  if (!username || !password || !id) {
    alert("Fill all fields");
    return;
  }

  peer = new Peer();

  peer.on("open", () => {
    conn = peer.connect(id);

    conn.on("open", () => {
      conn.send({ type:"auth", pass:password, user:username });
    });

    conn.on("data", receive);
    showChat();
  });
}

function receive(data) {
  if (data.type === "auth") {
    if (data.pass !== password) {
      alert("Wrong password");
      conn.close();
      return;
    }
    add("System", data.user + " joined");
  }

  if (data.type === "msg") {
    add(data.user, data.text);
  }
}

function send() {
  if (!conn) return;
  const t = text.value;
  if (!t) return;

  conn.send({ type:"msg", user:username, text:t });
  add("Me", t);
  text.value = "";
}

function add(u,t) {
  msgs.innerHTML += `<div class="msg"><b>${u}:</b> ${t}</div>`;
  msgs.scrollTop = msgs.scrollHeight;
}

function showChat() {
  join.style.display="none";
  chat.style.display="block";
}
</script>

</body>
</html>
